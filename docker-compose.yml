services:

  db:
    image: postgres:15.4-alpine
    ports:
      - 5432:5432
    env_file:
      - ./.env
    volumes:
      - ./db:/var/lib/postgresql/data

  api:
    build: .
    volumes:
      - ./api:/app
    ports:
      - 3300:3000
    env_file:
      - ./.env
    tty: true
    depends_on:
      - db

  hospital:
    build: .
    volumes:
      - ./hospital:/app
    ports:
      - 3001:3000
    env_file:
      - ./.env
    tty: true

  doctor:
    build: .
    volumes:
      - ./doctor:/app
    ports:
      - 3002:3000
    env_file:
      - ./.env
    tty: true

  receptionist:
    build: .
    volumes:
      - ./receptionist:/app
    ports:
      - 3003:3000
    env_file:
      - ./.env
    tty: true
