<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img src="logo.png" alt="MEDI CARE logo" />
      </div>

      <div class="Login-form">
        <h2>Login</h2>
        <form>
          <div class="lab-inp">
            <label for="">Email address</label>
            <input type="email" placeholder="Enter email" />
          </div>

          <div class="lab-inp">
            <label for="">Password</label>
            <input type="password" placeholder="Enter password" />
            <p>It must be a combination of minimum 8 letters, and symbols</p>
          </div>

          <div class="inp-chk">
            <div class="chkbox">
              <input type="checkbox" class="check-box" /><span
                >Remember me</span
              >
            </div>
            <a href="#">Forgot Password</a>
          </div>

          <button>Login</button>
          <hr />

          <p style="margin-top: 20px">
            No account yet <span style="color: rgb(60, 60, 243)">Sign-up</span>
          </p>
        </form>
      </div>
    </div>
  </body>
</html>
